name: BLACKOUT REBOOT — movement, audio & weapon checks
on:
  push:
    paths:
      - 'games/blackout/**'
      - '.github/workflows/blackout-regression.yml'
  pull_request:
    paths:
      - 'games/blackout/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    name: Reboot V0.25.3 · bomb solid drone collision, 3D kneeling defuser animation and escalating beeps
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse isolated foundation JS
        run: |
          node --check games/blackout/online-multiplayer.js
          node --check games/blackout/online-state.js
          node --check games/blackout/src/multiplayer-protocol.js
          node --check games/blackout/multiplayer-room.js
          node --check games/blackout/reboot/main.js
          node --check games/blackout/reboot/physics.js
          node --check games/blackout/reboot/footsteps.js
          node --check games/blackout/reboot/weapon.js
          node --check games/blackout/reboot/weapon-view.js
          node --check games/blackout/reboot/weapon-model.js
          node --check games/blackout/reboot/weapon-aim.js
          node --check games/blackout/reboot/lean.js
          node --check games/blackout/reboot/legacy-weapons.js
          node --check games/blackout/reboot/legacy-ballistics.js
          node --check games/blackout/reboot/legacy-audio.js
          node --check games/blackout/reboot/legacy-shooting.js
          node --check games/blackout/reboot/aim-resolver.js
          node --check games/blackout/reboot/range-layout.js
          node --check games/blackout/reboot/shot-ray.js
          node --check games/blackout/reboot/impact-decals.js
          node --check games/blackout/reboot/combat-raycast.js
          node --check games/blackout/reboot/tactical-hud.js
          node --check games/blackout/reboot/barricade.js
          node --check games/blackout/reboot/barricade-view.js
          node --check games/blackout/reboot/soft-wall.js
          node --check games/blackout/reboot/soft-wall-view.js
          node --check games/blackout/reboot/reinforcement.js
          node --check games/blackout/reboot/reinforcement-view.js
          node --check games/blackout/reboot/drone-physics.js
          node --check games/blackout/reboot/drone-view.js
          node --check games/blackout/reboot/drone-roster.js
          node --check games/blackout/reboot/operators.js
          node --check games/blackout/reboot/operator-select.js
          node --check games/blackout/reboot/secondary-loadout.js
          node --check games/blackout/reboot/barbed-wire.js
          node --check games/blackout/reboot/barbed-wire-view.js
          node --check games/blackout/reboot/melee.js
          node --check games/blackout/reboot/melee-view.js
          node --check games/blackout/reboot/wire-sound.js
          node --check games/blackout/reboot/nitro.js
          node --check games/blackout/reboot/nitro-view.js
          node --check games/blackout/reboot/impact.js
          node --check games/blackout/reboot/impact-view.js
          node --check games/blackout/reboot/frag.js
          node --check games/blackout/reboot/frag-view.js
          node --check games/blackout/reboot/flash.js
          node --check games/blackout/reboot/flash-view.js
          node --check games/blackout/reboot/smoke.js
          node --check games/blackout/reboot/smoke-view.js
          node --check games/blackout/reboot/throw-preview.js
          node --check games/blackout/reboot/throw-preview-view.js
          node --check games/blackout/reboot/blast-policy.js
          node --check games/blackout/reboot/soft-breach.js
          node --check games/blackout/reboot/soft-breach-view.js
          node --check games/blackout/reboot/hard-breach.js
          node --check games/blackout/reboot/hard-breach-view.js
          node --check games/blackout/reboot/claymore.js
          node --check games/blackout/reboot/claymore-view.js
          node --check games/blackout/reboot/observation-blocker.js
          node --check games/blackout/reboot/observation-blocker-view.js
          node --check games/blackout/reboot/proximity-alarm.js
          node --check games/blackout/reboot/proximity-alarm-view.js
          node --check games/blackout/reboot/deployable-shield.js
          node --check games/blackout/reboot/deployable-shield-view.js
          node --check games/blackout/reboot/shield-vault.js
          node --check games/blackout/reboot/bomb-round.js
          node --check games/blackout/reboot/bomb-round-view.js
          node --check games/blackout/reboot/bomb-presentation.js
          node --check games/blackout/reboot/bomb-interaction-view.js
          node --check games/blackout/reboot/breach-vault.js
      - name: Run clean-reboot movement, audio and weapon regression tests
        run: node --test games/blackout/reboot/*.test.mjs games/blackout/online-state.test.mjs
