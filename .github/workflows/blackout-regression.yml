name: BLACKOUT REBOOT — foundation checks
on:
  push:
    paths:
      - 'games/blackout/**'
      - '.github/workflows/blackout-regression.yml'
  pull_request:
    paths:
      - 'games/blackout/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    name: Reboot V0.1 · movement, collision and clean entry point
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse isolated foundation JS
        run: |
          node --check games/blackout/reboot/main.js
          node --check games/blackout/reboot/physics.js
      - name: Run only the clean-reboot regression tests
        run: node --test games/blackout/reboot/*.test.mjs
