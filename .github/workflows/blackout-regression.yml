name: BLACKOUT mechanic and UI regression
on:
  push:
    paths:
      - 'games/blackout/**'
      - '.github/workflows/blackout-regression.yml'
  pull_request:
    paths:
      - 'games/blackout/**'
  workflow_dispatch:
jobs:
  tests:
    name: Mechanics and competitive UI source tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all BLACKOUT regression tests
        run: node --test games/blackout/tests/*.test.mjs
