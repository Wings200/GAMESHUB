name: BLACKOUT multiplayer Worker — verify and optional deploy

on:
  push:
    paths:
      - 'worker.js'
      - 'wrangler.json'
      - 'games/blackout/multiplayer-room.js'
      - 'games/blackout/src/multiplayer-protocol.js'
      - 'games/blackout/maps/ironvale-operations.blackout-map.json'
      - '.github/workflows/blackout-worker-release.yml'
  workflow_dispatch:
    inputs:
      publish_shared_worker:
        description: 'EXPLICIT OPT-IN: deploy shared REDLINE/BLACKOUT Cloudflare Worker to production?'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify BLACKOUT multiplayer room and authoritative collision tests
        run: |
          node --test games/blackout/tests/network-room-v8.test.mjs games/blackout/tests/online-v8.test.mjs games/blackout/tests/ironvale-runtime-v8.test.mjs
      - name: Bundle the shared Cloudflare Worker without deploying it
        run: npx --yes wrangler@latest deploy --dry-run --outdir .wrangler/blackout-verified

  deploy-shared-worker:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_shared_worker == true }}
    needs: verify-worker
    runs-on: ubuntu-latest
    environment: blackout-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check explicitly connected Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Configure CLOUDFLARE_API_TOKEN as a GitHub Actions secret first."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Configure CLOUDFLARE_ACCOUNT_ID as a GitHub Actions secret first."; exit 1; }
      - name: Explicit production release — affects BOTH existing REDLINE and BLACKOUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Check live BLACKOUT route is published
        run: |
          curl --fail --silent --show-error --retry 3 \
            "https://redline-multiplayer.guestuseonly0173.workers.dev/api/blackout/rooms/ABC234/status" \
            --output /tmp/blackout-route.json || true
          if grep -q "Room not found" /tmp/blackout-route.json; then
            echo "BLACKOUT Worker route is responding (unknown room expected)."
          else
            echo "::error::Live BLACKOUT route did not return expected unknown-room response."
            cat /tmp/blackout-route.json
            exit 1
          fi
