name: Vault Directive
on:
  push:
    branches:
      - main
      - feature/vault-directive-*
    paths:
      - "games/vault-directive/**"
      - "tests/vault-directive.test.mjs"
      - "tests/vault-directive-ui.test.mjs"
      - "index.html"
      - "tests/public-library.test.mjs"
      - ".github/workflows/vault-directive.yml"
  pull_request:
    paths:
      - "games/vault-directive/**"
      - "tests/vault-directive.test.mjs"
      - "tests/vault-directive-ui.test.mjs"
      - "index.html"
      - "tests/public-library.test.mjs"
      - ".github/workflows/vault-directive.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate game and library
        run: node --test tests/vault-directive.test.mjs tests/vault-directive-ui.test.mjs tests/public-library.test.mjs
