name: VAULT DIRECTIVE reboot checks

on:
  push:
    branches:
      - main
      - 'feature/vault-directive-*'
      - 'fix/vault-directive-*'
    paths:
      - 'games/vault-directive/**'
      - 'tests/vault-directive-v4.test.mjs'
      - '.github/workflows/vault-directive.yml'
  pull_request:
    paths:
      - 'games/vault-directive/**'
      - 'tests/vault-directive-v4.test.mjs'
      - '.github/workflows/vault-directive.yml'
  workflow_dispatch:

jobs:
  test:
    name: Underground simulation and UI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check games/vault-directive/model.js
          node --check games/vault-directive/art.js
          node --check games/vault-directive/game-v4.js
          node --check tests/vault-directive-v4.test.mjs
      - name: Test actual simulation and controller
        run: node --test tests/vault-directive-v4.test.mjs
