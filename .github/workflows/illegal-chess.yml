name: Illegal Chess prototype
on:
  pull_request:
    paths:
      - "games/illegal-chess/**"
      - "functions/api/illegal-chess/**"
      - "tests/illegal-chess.test.mjs"
      - "tests/illegal-chess-api.test.mjs"
      - ".github/workflows/illegal-chess.yml"
  push:
    branches: [main, "feature/illegal-chess-multiplayer"]
    paths:
      - "games/illegal-chess/**"
      - "functions/api/illegal-chess/**"
      - "tests/illegal-chess.test.mjs"
      - "tests/illegal-chess-api.test.mjs"
      - ".github/workflows/illegal-chess.yml"
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check games/illegal-chess/engine.mjs
      - run: node --check games/illegal-chess/game.mjs
      - run: node --check 'functions/api/illegal-chess/[[path]].js'
      - name: Check browser module syntax
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import vm from "node:vm";
          import assert from "node:assert/strict";
          const html = fs.readFileSync("games/illegal-chess/index.html", "utf8");
          const start = html.indexOf('<script type="module">');
          const end = html.indexOf("</script>", start);
          assert.ok(start >= 0 && end > start, "Inline browser script missing");
          const source = html.slice(start + '<script type="module">'.length, end);
          new vm.Script(source);
          assert.match(html, /id="board"/);
          EOF
      - run: node --test tests/illegal-chess.test.mjs tests/illegal-chess-api.test.mjs
