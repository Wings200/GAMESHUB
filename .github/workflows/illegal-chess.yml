name: Illegal Chess prototype
on:
  pull_request:
    paths:
      - "games/illegal-chess/**"
      - "functions/api/illegal-chess/**"
      - "tests/illegal-chess.test.mjs"
      - "tests/illegal-chess-api.test.mjs"
      - ".github/workflows/illegal-chess.yml"
  push:
    branches: [main, "feature/illegal-chess-multiplayer"]
    paths:
      - "games/illegal-chess/**"
      - "functions/api/illegal-chess/**"
      - "tests/illegal-chess.test.mjs"
      - "tests/illegal-chess-api.test.mjs"
      - ".github/workflows/illegal-chess.yml"
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check games/illegal-chess/engine.mjs
      - run: node --check games/illegal-chess/game.mjs
      - run: node --check games/illegal-chess/analyst.mjs
      - run: node --check games/illegal-chess/cinematic.mjs
      - run: node --check games/illegal-chess/stockfish-review.mjs
      - run: node --check games/illegal-chess/stockfish-cdn-worker.js
      - run: node --check 'functions/api/illegal-chess/[[path]].js'
      - run: node --check games/illegal-chess/client.mjs
      - run: node --check games/illegal-chess/art.mjs
      - name: Verify game page keeps interactions in-site
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const html=fs.readFileSync("games/illegal-chess/index.html","utf8");
          const client=fs.readFileSync("games/illegal-chess/client.mjs","utf8");
          assert.match(html,/id="board"/);
          assert.match(html,/id="modalShade"/);
          assert.match(html,/client\.mjs/);
          assert.match(html,/style\.css/);
          assert.doesNotMatch(client,/\b(?:window\.)?(?:alert|prompt|confirm)\s*\(/);
          assert.match(client,/cardImage\(/);
          assert.match(client,/sniperShots/);
          assert.match(html,/id="analystPanel"/);
          assert.match(html,/id="analystTest"/);
          assert.match(client,/renderAnalyst\(/);
          assert.match(client,/createStockfishReviewer/);
          assert.match(client,/analystLeader\(\)/,"Only the elected player may compute reviews");
          assert.match(client,/analystDeviceScore/,"Device capability-based election must be present");
          assert.match(client,/intent:"submit"/,"The browser must publish its result to the shared room");
          assert.match(client,/stockfish-review\.mjs\?v=4/,"New engine worker code must be cache-busted");
          assert.match(html,/ALPHA 0\.9\.2/,"Bishop Sniper cinematic release must load");
          const api=fs.readFileSync("functions/api/illegal-chess/[[path]].js","utf8");
          assert.match(api,/analystRequest/,"Server-authoritative Analyst lease and review endpoint");
          assert.match(client,/retryStockfish/,"Recover failed analyzer without leaving match");
          assert.match(html,/id="retryStockfish"/,"A retry button must exist");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-review.mjs","utf8"),/engineSources/,"Engine must attempt multiple hosts");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-review.mjs","utf8"),/stockfish-19-single\.js/,"Default must use full NNUE Stockfish");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-review.mjs","utf8"),/go depth /,"Engine must perform a bounded UCI search");
          assert.match(fs.readFileSync("functions/api/illegal-chess/[[path]].js","utf8"),/stockfish-19-single\.wasm/,"Pages proxy must serve full NNUE WASM");
          assert.match(html,/ALPHA 0\.9/,"Browser assets must be version-bumped");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-cdn-worker.js","utf8"),/importScripts/,"Same-origin CDN worker shim");
          assert.match(html,/id="analystLegend"/,"Round feedback legend must be present");
          assert.match(client,/analystPopupTimer=setTimeout\([\s\S]*?\},1000\)/,"One-second board feedback remains enabled");
          assert.match(client,/className="analystCoin analystCoinSmall "/,"Circular symbols in the review history");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-review.mjs","utf8"),/searchmoves/,"Real Stockfish root move search");
          assert.match(client,/analystPopupTimer=setTimeout\([\s\S]*?\},1000\)/,"Move grade overlay must disappear after 1 second");
          assert.match(client,/analystSeenTurn===null/,"Do not replay archived grades on reconnect");
          assert.match(client,/analystPopup\?\.square===name/,"Move-grade symbol follows the piece's destination square");
          assert.match(fs.readFileSync("games/illegal-chess/analyst.mjs","utf8"),/gradeAnalystTurn/);
          const style=fs.readFileSync("games/illegal-chess/style.css","utf8");
          assert.match(client,/for\(let n=0;n<100;n\+\+\)/,"The board must include the extra off-board ring");
          assert.match(client,/offboardSniper/,"Own bishop must be rendered in the extra ring");
          assert.match(client,/sniperVision/,"Sniper diagonal must be visible to owner");
          assert.match(client,/game\.sniperShots\?\.includes\(name\)/,"Board must accept direct sniper targets");
          assert.match(html,/id="sniperCinematic"/,"Tactical replay overlay must be present");
          assert.match(html,/id="cinematicTargetPiece"/,"Captured piece art must be drawn");
          assert.match(client,/syncSniperCinematics\(\)/,"Only server-recorded actions trigger cinematics");
          assert.match(client,/nextCinematic\(game\?\.cinematics,cinematicSeen\)/,"Opponent polling must dedupe shots");
          assert.match(client,/sniperWarpTarget===name/,"Second shot needs a board-only teleport");
          assert.match(fs.readFileSync("games/illegal-chess/cinematic.mjs","utf8"),/sniper-first-shot/);
          assert.match(style,/\.sniperCinematic\.isPlaying/,"First shot needs fullscreen CSS animation");
          assert.match(style,/prefers-reduced-motion:reduce/,"Animations must respect reduced-motion users");
          assert.match(style,/repeat\(10,minmax\(0,1fr\)\)/,"10x10 board including one-square perimeter");
          assert.match(style,/\.square\.sniperRay/);
          assert.match(style,/\.analystMoveSymbol/,"Transient grade badge must have board styling");

          EOF
      - run: node --test tests/illegal-chess.test.mjs tests/illegal-chess-api.test.mjs
