name: Illegal Chess prototype
on:
  pull_request:
    paths:
      - "games/illegal-chess/**"
      - "functions/api/illegal-chess/**"
      - "tests/illegal-chess.test.mjs"
      - "tests/illegal-chess-rescue.test.mjs"
      - "tests/illegal-chess-api.test.mjs"
      - ".github/workflows/illegal-chess.yml"
  push:
    branches: [main, "feature/illegal-chess-multiplayer"]
    paths:
      - "games/illegal-chess/**"
      - "functions/api/illegal-chess/**"
      - "tests/illegal-chess.test.mjs"
      - "tests/illegal-chess-rescue.test.mjs"
      - "tests/illegal-chess-api.test.mjs"
      - ".github/workflows/illegal-chess.yml"
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check games/illegal-chess/engine.mjs
      - run: node --check games/illegal-chess/game.mjs
      - run: node --check games/illegal-chess/analyst.mjs
      - run: node --check games/illegal-chess/cinematic.mjs
      - run: node --check games/illegal-chess/sniper-3d.mjs
      - run: node --check games/illegal-chess/sniper-sound.mjs
      - run: node --check games/illegal-chess/sniper-sculpts.mjs
      - run: node --check games/illegal-chess/stockfish-review.mjs
      - run: node --check games/illegal-chess/stockfish-cdn-worker.js
      - run: node --check 'functions/api/illegal-chess/[[path]].js'
      - run: node --check games/illegal-chess/client.mjs
      - run: node --check games/illegal-chess/art.mjs
      - name: Verify game page keeps interactions in-site
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const html=fs.readFileSync("games/illegal-chess/index.html","utf8");
          const client=fs.readFileSync("games/illegal-chess/client.mjs","utf8");
          assert.match(html,/id="board"/);
          assert.match(html,/id="quickPlay"/,"Public quick play button must exist");
          assert.match(html,/id="hostPublic"/,"Public hosting button must exist");
          assert.match(html,/id="publicRooms"/,"Open public server list must exist");
          assert.match(html,/id="refreshPublic"/,"Public lobby list refresh must exist");
          assert.match(client,/publicPresence\(\)/,"Only live hosts should remain discoverable");
          assert.match(client,/joinPublicRoom\(/,"Joining a listed server must be possible");
          assert.match(client,/publicAction\("quick-join"\)/,"Quick Play must match with live rooms");
          assert.match(client,/api\("public-list"/,"Public list must refresh inside the site");
          assert.match(html,/id="modalShade"/);
          assert.match(html,/client\.mjs/);
          assert.match(html,/style\.css/);
          assert.doesNotMatch(client,/\b(?:window\.)?(?:alert|prompt|confirm)\s*\(/);
          assert.match(client,/cardImage\(/);
          assert.match(client,/sniperShots/);
          assert.match(html,/id="analystPanel"/);
          assert.doesNotMatch(html,/id="analystTest"|id="sniperTest"/,"No public guaranteed-card test hosting controls");
          assert.match(client,/renderAnalyst\(/);
          assert.match(client,/createStockfishReviewer/);
          assert.match(client,/analystLeader\(\)/,"Only the elected player may compute reviews");
          assert.match(client,/analystDeviceScore/,"Device capability-based election must be present");
          assert.match(client,/intent:"submit"/,"The browser must publish its result to the shared room");
          assert.match(client,/stockfish-review\.mjs\?v=4/,"New engine worker code must be cache-busted");
          assert.match(html,/ALPHA 0\\.11\\.2/,"Multiplayer card casting release must load");
           assert.match(html,/style\\.css\\?v=18/,"Fresh casting CSS must be cache-busted");
           assert.match(html,/client\\.mjs\\?v=23/,"Fresh card-cast client must be cache-busted");
           assert.match(client,/cinematic\\.mjs\\?v=3/,"New cast detector must be loaded");
           assert.match(client,/syncCardCasts\\(\\)/,"Both players must see used-card animations");
           assert.match(html,/id="cardActivation"/,"Nonblocking card cast overlay must exist");
           assert.match(fs.readFileSync("games/illegal-chess/style.css","utf8"),/cardCastPanel/,"Cast reveal must have transition animation");
          const api=fs.readFileSync("functions/api/illegal-chess/[[path]].js","utf8");
          assert.match(api,/analystRequest/,"Server-authoritative Analyst lease and review endpoint");
          assert.match(api,/Only a player holding The Analyst/,"Unentitled clients must not use engine commands");
          const analysis=fs.readFileSync("games/illegal-chess/analyst.mjs","utf8");
          assert.match(analysis,/analystActive=\(g,color=null\)/,"Passive ownership requires an optional seat check");
          const game=fs.readFileSync("games/illegal-chess/game.mjs","utf8");
          assert.doesNotMatch(game,/function (?:sniperTestHand|analystTestHand)/,"No guaranteed-card production draws");
          assert.doesNotMatch(client,/api\("create",\{mode:/,"No client test-room creation");
          assert.match(api,/Guaranteed-card test rooms are no longer available/,"Old test-room mode requests are rejected");
          assert.match(game,/canAnalyze=analystActive\(g,color\)/,"The Analyst must be owner-specific");
          assert.match(game,/entries:canAnalyze\?/,"Non-owners must not receive scores or analysis FENs");
          assert.match(game,/worker:canAnalyze&&/,"Non-owners must not see the worker lease");
          assert.match(client,/panel\.hidden=!active/,"The Analyst panel must be hidden without ownership");
          assert.match(client,/if\(!game\?\.analyst\?\.active\)/,"Remove leftover on-board grades for non-owners");
          assert.match(html,/client\.mjs\?v=22/,"Force a refreshed 36-card client asset");
          assert.match(client,/retryStockfish/,"Recover failed analyzer without leaving match");
          assert.match(html,/id="retryStockfish"/,"A retry button must exist");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-review.mjs","utf8"),/engineSources/,"Engine must attempt multiple hosts");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-review.mjs","utf8"),/stockfish-19-single\.js/,"Default must use full NNUE Stockfish");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-review.mjs","utf8"),/go depth /,"Engine must perform a bounded UCI search");
          assert.match(fs.readFileSync("functions/api/illegal-chess/[[path]].js","utf8"),/stockfish-19-single\.wasm/,"Pages proxy must serve full NNUE WASM");
          assert.match(html,/ALPHA 0\.11/,"Browser assets must be version-bumped");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-cdn-worker.js","utf8"),/importScripts/,"Same-origin CDN worker shim");
          assert.match(html,/id="analystLegend"/,"Round feedback legend must be present");
          assert.match(client,/analystPopupTimer=setTimeout\([\s\S]*?\},1000\)/,"One-second board feedback remains enabled");
          assert.match(client,/className="analystCoin analystCoinSmall "/,"Circular symbols in the review history");
          assert.match(fs.readFileSync("games/illegal-chess/stockfish-review.mjs","utf8"),/searchmoves/,"Real Stockfish root move search");
          assert.match(client,/analystPopupTimer=setTimeout\([\s\S]*?\},1000\)/,"Move grade overlay must disappear after 1 second");
          assert.match(client,/analystSeenTurn===null/,"Do not replay archived grades on reconnect");
          assert.match(client,/analystPopup\?\.square===name/,"Move-grade symbol follows the piece's destination square");
          assert.match(fs.readFileSync("games/illegal-chess/analyst.mjs","utf8"),/gradeAnalystTurn/);
          const style=fs.readFileSync("games/illegal-chess/style.css","utf8");
          assert.match(client,/for\(let n=0;n<100;n\+\+\)/,"The board must include the extra off-board ring");
          assert.match(client,/offboardSniper/,"Own bishop must be rendered in the extra ring");
          assert.match(client,/sniperVision/,"Sniper diagonal must be visible to owner");
          assert.match(client,/game\.sniperShots\?\.includes\(name\)/,"Board must accept direct sniper targets");
          assert.match(html,/id="sniperCinematic"/,"Tactical replay overlay must be present");
          assert.match(html,/id="sniper3DCanvas"/,"3D replay must have a real WebGL canvas");
          assert.match(client,/createSniper3D/,"The 3D renderer must be invoked by server-triggered shot");
          assert.match(client,/sniperRenderer.play\(event\)/,"A first shot must start the 3D camera");
          assert.match(client,/cinematic\.mjs\?v=2/,"Updated V2 runtime events must avoid stale cache");
          assert.match(client,/sniper-3d\.mjs\?v=3/,"Sculpted V3 renderer must be loaded");
          const real3d=fs.readFileSync("games/illegal-chess/sniper-3d.mjs","utf8");
          assert.match(real3d,/getContext\("webgl"/,"Actual GPU 3D, not fake 2D scaling");
          assert.match(real3d,/SNIPER_3D_DURATION=4900/,"Long close-up, bullet-follow and impact");
          assert.match(real3d,/cinematicCamera\(event,ms\)/,"Physical camera positions must animate");
          assert.match(real3d,/drawWorld\(gl,graphics,event,elapsed,w,h\)/,"GPU frames must contain 3D scene");
          assert.match(real3d,/Chrome OS\|Chromebook/,"Chromebook performance profile is enabled");
          assert.match(real3d,/function sniperMotion|export function sniperMotion/,"V4 must animate real weapon recoil/zoom");
          assert.match(real3d,/shotPhase\(|shockwave|sniperMotion/,"3D impacts must follow a shared deterministic timeline");
          assert.match(real3d,/g\.compact\?18:38/,"Low-end devices must have fewer 3D fragments");
          assert.match(real3d,/d\("ring",\[hit\[0\],\.21/,"Physical 3D shockwave must be drawn");
          const audio=fs.readFileSync("games/illegal-chess/sniper-sound.mjs","utf8");
          assert.match(audio,/createSniperSoundtrack/,"Procedural SFX module must exist");
          assert.match(audio,/createOscillator/,"Rifle SFX require synthesized pitches");
          assert.match(audio,/createBufferSource/,"Rifle and bullet SFX require filtered noise");
          assert.match(audio,/SNIPER_FALLBACK_CUES/,"WebGL-less devices need a shorter audio timeline");
          assert.match(client,/sniper-sound\.mjs\?v=1/,"Client must load cache-busted sounds");
          assert.match(client,/sniperAudio\.playFirstShot\(\)/,"Cinematic must play first-shot sound");
          assert.match(client,/sniperAudio\.playTeleport\(\)/,"Second shot must have distinct teleport sound");
          assert.match(client,/sniperAudio\.playFallbackShot\(\)/,"Fallback must not produce late 3D audio cues");
          assert.match(client,/pointerdown.*unlockSniperSound/,"Audio unlock must require a real gesture");
          assert.match(html,/id="sniperSoundToggle"/,"Match must expose a local SFX toggle");
          assert.match(html,/class="cinematicAimHud"/,"3D scope HUD required");
          assert.match(html,/class="cinematicBulletHud"/,"Bullet slow-motion HUD required");
          assert.match(client,/sniper-3d\.mjs\?v=3/,"Sculpted model renderer must refresh cached V2 renderer");
          assert.match(real3d,/buildSculptMeshes\(\)/,"New sculpt meshes are merged into the GPU buffer");
          assert.match(real3d,/d\("sculptBishop"/,"Bishop cannot be a generic cylinder in the cinematic");
          assert.match(real3d,/sculptPawn/,"Captured pawn has its own 3D model");
          assert.match(real3d,/sculptRook/,"Captured rook has its own 3D model");
          assert.match(real3d,/sculptKnight/,"Captured knight has its own 3D model");
          assert.match(real3d,/sculptQueen/,"Captured queen has its own 3D model");
          assert.match(real3d,/sculptKing/,"Captured king has its own 3D model");
          assert.doesNotMatch(real3d,/d\("chess"/,"Generic one-size-fits-all victim model is retired");
          const sculpt=fs.readFileSync("games/illegal-chess/sniper-sculpts.mjs","utf8");
          assert.match(sculpt,/function buildSculptMeshes|export function buildSculptMeshes/,"Detailed chess geometry generator required");
          assert.match(sculpt,/sculptRifleStock/,"Rifle stock must have its own shaped mesh");
          assert.match(sculpt,/sculptScope/,"Scope must have its own shaped mesh");
          assert.match(sculpt,/sculptKnightMane/,"Knight needs a carved mane profile");
          assert.match(sculpt,/Engraved mitre slot/,"Bishop mitre must have a sculpted groove");
          assert.match(html,/id="cinematicTargetPiece"/,"Captured piece art must be drawn");
          assert.match(client,/syncSniperCinematics\(\)/,"Only server-recorded actions trigger cinematics");
          assert.match(client,/nextCinematic\(game\?\.cinematics,cinematicSeen\)/,"Opponent polling must dedupe shots");
          assert.match(client,/sniperWarpTarget===name/,"Second shot needs a board-only teleport");
          assert.match(fs.readFileSync("games/illegal-chess/cinematic.mjs","utf8"),/sniper-first-shot/);
          assert.match(style,/\.sniperCinematic\.isPlaying/,"First shot needs fullscreen CSS animation");
          assert.match(style,/\.cinematicAimHud/,"Scope animation must be styled");
          assert.match(style,/\.cinematicBulletHud/,"Slow-motion HUD must be styled");
          assert.match(style,/\.cinematicProgress/,"Timing progress bar must be styled");
          assert.match(style,/\.sniperCinematic\.is3D\.isPlaying/,"WebGL replay must remain visible for 4.9s");
          assert.match(style,/\.cinematic3DCanvas/,"3D stage must render fullscreen");
          assert.match(style,/prefers-reduced-motion:reduce/,"Animations must respect reduced-motion users");
          assert.match(style,/repeat\(10,minmax\(0,1fr\)\)/,"10x10 board including one-square perimeter");
          assert.match(style,/\.square\.sniperRay/);
          assert.match(style,/\.analystMoveSymbol/,"Transient grade badge must have board styling");

          EOF
      - run: node --test tests/illegal-chess.test.mjs tests/illegal-chess-api.test.mjs tests/illegal-chess-rescue.test.mjs
