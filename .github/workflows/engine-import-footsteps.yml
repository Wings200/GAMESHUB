name: Import CC0 footsteps for engine staging
on:
  push:
    branches: [feature/engine-fixture-lighting-footsteps-dev008]
    paths:
      - 'tools/audio/import_kenney_footsteps.py'
      - '.github/workflows/engine-import-footsteps.yml'
permissions:
  contents: write
jobs:
  vendor-footsteps:
    if: ${{ !contains(github.event.head_commit.message, '[step-assets]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify Kenney CC0 audio
        run: python tools/audio/import_kenney_footsteps.py
      - name: Commit original audio in the feature branch
        run: |
          git config user.name "gameshub-asset-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/engine-test/assets/audio/
          if ! git diff --cached --quiet; then
            git commit -m "Vendor CC0 Kenney concrete footsteps [step-assets]"
            git push origin HEAD:feature/engine-fixture-lighting-footsteps-dev008
          fi
