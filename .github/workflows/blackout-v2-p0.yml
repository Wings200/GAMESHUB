name: BLACKOUT 2.0 P0 — isolated prototype checks

on:
  pull_request:
    paths:
      - "games/blackout/v2/**"
      - ".github/workflows/blackout-v2-p0.yml"
  push:
    branches:
      - main
    paths:
      - "games/blackout/v2/**"
      - ".github/workflows/blackout-v2-p0.yml"

jobs:
  validate-p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JavaScript syntax
        run: |
          node --check games/blackout/v2/main.js
          node --check games/blackout/v2/world.mjs
          node --check games/blackout/v2/rules.mjs
      - name: Round-rule regressions
        run: node --test games/blackout/v2/rules.test.mjs
