name: RPG Foundation 0.1 — rules and syntax

on:
  push:
    paths:
      - 'games/rpg-prototype/**'
      - '.github/workflows/rpg-foundation.yml'
  pull_request:
    paths:
      - 'games/rpg-prototype/**'
      - '.github/workflows/rpg-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript module syntax
        run: |
          node --check games/rpg-prototype/main.js
          node --check games/rpg-prototype/testing/main.js
          node --check games/rpg-prototype/movement.mjs
          node --check games/rpg-prototype/movement.test.mjs
          node --check games/rpg-prototype/weapons.mjs
          node --check games/rpg-prototype/weapons.test.mjs
          node --check games/rpg-prototype/weapon-sights.mjs
          node --check games/rpg-prototype/weapon-sights.test.mjs
          node --check games/rpg-prototype/power-armor.mjs
          node --check games/rpg-prototype/power-armor-visual.mjs
          node --check games/rpg-prototype/power-armor.test.mjs
          node --check games/rpg-prototype/weapon-handling.mjs
          node --check games/rpg-prototype/weapon-handling.test.mjs
          node --check games/rpg-prototype/combat.mjs
          node --check games/rpg-prototype/combat.test.mjs
          node --check games/rpg-prototype/enemy-ai.mjs
          node --check games/rpg-prototype/enemy-ai.test.mjs
          node --check games/rpg-prototype/enemy-tactics.mjs
          node --check games/rpg-prototype/enemy-tactics.test.mjs
          node --check games/rpg-prototype/enemy-squad.mjs
          node --check games/rpg-prototype/enemy-squad.test.mjs
          node --check games/rpg-prototype/inventory.mjs
          node --check games/rpg-prototype/inventory.test.mjs
          node --check games/rpg-prototype/player-combat.mjs
          node --check games/rpg-prototype/player-combat.test.mjs
          node --check games/rpg-prototype/station9.test.mjs
          node --check games/rpg-prototype/arena-activation.mjs
          node --check games/rpg-prototype/arena-activation.test.mjs
          node --check games/rpg-prototype/browser-smoke.mjs
          node --check games/rpg-prototype/weapon-audio.mjs
          node --check games/rpg-prototype/weapon-audio.test.mjs
          node --check games/rpg-prototype/rules.mjs
          node --check games/rpg-prototype/rules.test.mjs
      - name: Test collision, terrain and first quest
        run: node --test games/rpg-prototype/rules.test.mjs games/rpg-prototype/movement.test.mjs games/rpg-prototype/weapons.test.mjs games/rpg-prototype/weapon-sights.test.mjs games/rpg-prototype/power-armor.test.mjs games/rpg-prototype/weapon-audio.test.mjs games/rpg-prototype/weapon-handling.test.mjs games/rpg-prototype/combat.test.mjs games/rpg-prototype/enemy-ai.test.mjs games/rpg-prototype/enemy-tactics.test.mjs games/rpg-prototype/enemy-squad.test.mjs games/rpg-prototype/inventory.test.mjs games/rpg-prototype/player-combat.test.mjs games/rpg-prototype/station9.test.mjs games/rpg-prototype/arena-activation.test.mjs

  browser-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser harness and locally served Three.js
        run: npm install --no-save --no-package-lock playwright-core three@0.180.0
      - name: Actually load 3D lab, move AI and damage a raider
        run: node games/rpg-prototype/browser-smoke.mjs
