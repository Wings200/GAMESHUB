name: Engine foundation checks
on:
  pull_request:
    paths:
      - 'engine/**'
      - 'games/engine-test/**'
      - 'tests/engine*.test.mjs'
      - '.github/workflows/engine-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'games/engine-test/**'
      - 'tests/engine*.test.mjs'
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          for f in engine/*.js games/engine-test/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/engine*.test.mjs

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium and browser driver
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start test server
        run: |
          python3 -m http.server 8080 > /tmp/gameshub-lab-http.log 2>&1 &
          sleep 2
      - name: Smoke-test material catalog, editing and saved variants
        run: node games/engine-test/materials-smoke.mjs
      - name: Smoke-test code-first GameWorld object and resource API
        run: node games/engine-test/world-api-smoke.mjs
      - name: Smoke-test spatial audio and mixer with real browser Web Audio nodes
        run: node games/engine-test/spatial-sound-smoke.mjs
      - name: Smoke-test code-first source-linked lighting and shadow rendering
        run: node games/engine-test/lighting-smoke.mjs
      - name: Smoke-test one unified multilevel movement, audio and lighting game session
        run: node games/engine-test/session-integration-smoke.mjs
      - name: Smoke-test animated characters, crossfades and one-shot actions
        run: node games/engine-test/animation-smoke.mjs
      - name: Smoke-test playable character animation testing room
        run: node games/engine-test/character-lab-smoke.mjs
      - name: Smoke-test WebGL room, quality presets and controls
        run: node games/engine-test/browser-smoke.mjs
