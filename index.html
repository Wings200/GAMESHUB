<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REDLINE</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="gameShell">
    <div id="menu" class="screen">
      <div class="menu-card">
        <div class="eyebrow">GAMESHUB PRESENTS</div>
        <h1>REDLINE</h1>
        <p class="sub">Lightweight 3D arcade racing built for browser play.</p>

        <label for="trackSelect">TRACK</label>
        <select id="trackSelect">
          <option value="neon">Neon District</option>
          <option value="canyon">Dustfall Canyon</option>
          <option value="arctic">Arctic Relay</option>
        </select>

        <div class="menu-actions">
          <button id="startBtn">START RACE</button>
          <a href="/" class="secondary">BACK TO GAMESHUB</a>
        </div>

        <div class="controls">
          <span>W / ↑ Accelerate</span>
          <span>S / ↓ Brake / Reverse</span>
          <span>A D / ← → Steer</span>
          <span>SPACE Handbrake</span>
          <span>SHIFT Nitro</span>
        </div>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div id="trackName">NEON DISTRICT</div>
        <div id="objective">LAP 1 / 3</div>
      </div>

      <div class="hud-right">
        <div class="speed-line"><span id="speed">0</span><small> MPH</small></div>
        <div class="gear-line">GEAR <span id="gear">1</span></div>
        <div class="bar-label">RPM</div>
        <div class="bar"><div id="rpmBar"></div></div>
        <div class="bar-label">NITRO</div>
        <div class="bar"><div id="nitroBar"></div></div>
      </div>

      <div id="fps">FPS 0</div>
    </div>

    <div id="countdown" class="hidden">3</div>

    <canvas id="gameCanvas"></canvas>

    <div id="message" class="hidden"></div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
