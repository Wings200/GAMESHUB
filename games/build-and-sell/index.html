 const wood=materials.wood;box(g,2,.11,.15,0,2.55,0,wood);for(const x of [-.95,.95])box(g,.10,2.45,.15,x,1.28,0,wood);
 if(w.type==="frame"){box(g,2,.11,.15,0,.05,0,wood);for(const x of [-.47,0,.47])box(g,.085,2.44,.13,x,1.28,0,wood);}
 if(w.type==="door"){box(g,1.8,.12,.15,0,2.06,0,wood);for(const x of [-.48,.48])box(g,.10,2,.15,x,1,0,wood);}
 if(w.type==="window"){box(g,2,.11,.15,0,.05,0,wood);box(g,1.75,.12,.15,0,.85,0,wood);box(g,1.75,.12,.15,0,1.86,0,wood);for(const x of [-.64,.64])box(g,.09,2.44,.14,x,1.28,0,wood);}
 if(w.finished){const m=materials.wall;if(w.type==="frame")box(g,2,2.55,.19,0,1.28,0,m);if(w.type==="door"){box(g,2,.48,.19,0,2.32,0,m);for(const x of [-.76,.76])box(g,.48,2.05,.19,x,1.025,0,m);}if(w.type==="window"){box(g,2,.85,.19,0,.425,0,m);box(g,2,.68,.19,0,2.2,0,m);for(const x of [-.82,.82])box(g,.36,1.05,.19,x,1.37,0,m);box(g,1.25,.97,.07,0,1.35,0,materials.glass);}}
}
function fixtureGeometry(g,t,k){
 if(electrical.includes(t)){const panel=t==="breaker";const y=panel?1.45:t==="outlet"?.55:1.2;box(g,panel?.43:.15,panel?.62:.23,.08,0,y,.14,materials.white);if(panel){for(let i=0;i<4;i++)box(g,.22,.055,.035,0,y-.19+i*.12,.2,materials.dark)}else if(t==="outlet"){for(const x of [-.035,.035])box(g,.012,.06,.012,x,y+.02,.19,materials.dark)}else box(g,.06,.09,.035,0,y,.2,materials.dark);if(!job.walls[k]?.finished)box(g,.027,Math.max(.2,2.55-y),.027,.19,(2.55+y)/2,.08,materials.wire);}
 else if(t==="sink"){box(g,.6,.78,.52,0,.4,0,materials.white);box(g,.67,.11,.58,0,.84,0,materials.steel);box(g,.05,.19,.05,0,.97,-.19,materials.steel);box(g,.05,.05,.17,0,1.05,-.12,materials.steel);}
 else if(t==="toilet"){box(g,.33,.35,.42,0,.18,0,materials.white);sphere(g,.25,0,.38,.08,materials.white);box(g,.36,.54,.18,0,.53,-.21,materials.white);}
 else if(t==="vent"){box(g,.48,.055,.3,0,.04,0,materials.steel);for(let i=0;i<6;i++)box(g,.4,.015,.012,0,.076,-.12+i*.048,materials.dark);}
 else {box(g,.72,.86,.58,0,.43,0,materials.steel);for(let i=0;i<5;i++)box(g,.5,.035,.025,0,.28+i*.09,.31,materials.dark);box(g,.3,.24,.3,0,.97,0,materials.steel);}
}
function rebuild(){
 if(preview)preview.visible=false;if(previewBounds)previewBounds.visible=false;
 siteGrid.position.x=job.origin.x;siteGrid.position.z=job.origin.z;siteGrid.visible=snap;previewSignature="";
 for(const o of [...root.children]){o.traverse(v=>{if(v.geometry)v.geometry.dispose()});root.remove(o)}worldMeshes=[];obstacles=[];
 for(const k of Object.keys(job.floors)){const p=center(k);addKey(box(root,1.99,.12,1.99,p.x,.09,p.z,materials.concrete),k);}
 for(const [k,w] of Object.entries(job.walls)){const p=center(k),g=group(root,p.x,.15,p.z);if(p.axis==="z")g.rotation.y=Math.PI/2;
 wallGeometry(g,w);
 addKey(g,k);if(w.type!=="door"){const a=p.axis==="x";obstacles.push({minX:p.x-(a?1:.12),maxX:p.x+(a?1:.12),minZ:p.z-(a?.12:1),maxZ:p.z+(a?.12:1)});}else{for(const d of [-.76,.76]){const x=p.x+(p.axis==="x"?d:0),z=p.z+(p.axis==="z"?d:0);obstacles.push({minX:x-(p.axis==="x"?.24:.12),maxX:x+(p.axis==="x"?.24:.12),minZ:z-(p.axis==="z"?.24:.12),maxZ:z+(p.axis==="z"?.24:.12)});}}
 }
 for(const [k,t] of Object.entries(job.fixtures)){const p=center(k),f=job.fixturePos[k]||{x:0,z:0},g=group(root,p.x+f.x,.15,p.z+f.z);if(p.axis==="z")g.rotation.y=Math.PI/2;
 fixtureGeometry(g,t,k);
 addKey(g,k);
 }
 for(const k of Object.keys(job.roofs)){const p=center(k);const o=box(root,2.02,.14,2.02,p.x,2.85,p.z,materials.roof);o.visible=roofVisible;addKey(o,k);}
}

function placementOffset(id,k,point){
 const p=center(k);if(!point||snap)return {x:0,z:0};
 const dx=point.x-p.x,dz=point.z-p.z;
 const limit=(v,max)=>Math.max(-max,Math.min(max,v));
 if(id==="floor"&&!Object.keys(job.floors).length){const x=limit(dx,.96),z=limit(dz,.96);return {x,z,origin:{x:job.origin.x+x,z:job.origin.z+z}}}
 if(electrical.includes(id)){const max=id==="breaker"?.73:.88;return {x:p.axis==="x"?limit(dx,max):0,z:p.axis==="z"?limit(dz,max):0};}
 if(wet.includes(id)||hvac.includes(id)){const radii={sink:[.35,.34],toilet:[.26,.36],vent:[.25,.16],air:[.37,.32]}[id];return {x:limit(dx,1-radii[0]),z:limit(dz,1-radii[1])};}
 return {x:0,z:0};
}
function refreshPreview(k,point){
 if(!preview)return;preview.visible=!!k&&!modalOpen;previewBounds.visible=preview.visible;if(!preview.visible)return;
 const offset=placementOffset(selected,k,point),p=center(k),sig=selected+"|"+k+"|"+offset.x.toFixed(3)+"|"+offset.z.toFixed(3);
 if(sig!==previewSignature){
 previewSignature=sig;for(const o of [...preview.children]){o.traverse(v=>{if(v.geometry)v.geometry.dispose()});preview.remove(o);}
 if(!ghostMaterial)ghostMaterial=new THREE.MeshBasicMaterial({color:0xc9ff91,transparent:true,opacity:.36,depthWrite:false});
 const type=selected==="remove"?(job.fixtures[k]|| (job.roofs[k]?"roof":job.walls[k]?.type||"floor")):selected;
 const actualOffset=selected==="remove"&&job.fixtures[k]?job.fixturePos[k]||offset:offset;
 const g=group(preview,p.x+actualOffset.x,.15,p.z+actualOffset.z);if(p.axis==="z")g.rotation.y=Math.PI/2;
 if(type==="floor")box(g,1.99,.12,1.99,0,-.06,0,materials.concrete);
 else if(type==="roof")box(g,2.02,.14,2.02,0,2.7,0,materials.roof);
 else if(["frame","door","window","finish"].includes(type))wallGeometry(g,{type:type==="finish"?job.walls[k]?.type||"frame":type,finished:type==="finish"||selected==="remove"&&!!job.walls[k]?.finished});
 else if(trade.includes(type))fixtureGeometry(g,type,k);
 g.traverse(v=>{if(v.isMesh){v.material=ghostMaterial;v.castShadow=false;v.receiveShadow=false}});
 preview.updateMatrixWorld(true);previewBounds.box.setFromObject(preview);previewBounds.updateMatrixWorld(true);
 }
 const error=check(job,selected,k)||reach(k);ghostMaterial.color.set(error?"#ed8b79":"#c9ff91");previewBounds.material.color.set(error?"#ed8b79":"#c9ff91");
}

function reach(k){const b=previewBounds?.visible?previewBounds.box:null,p=center(k);const x=b?Math.max(b.min.x,Math.min(avatar.position.x,b.max.x)):p.x,z=b?Math.max(b.min.z,Math.min(avatar.position.z,b.max.z)):p.z;return Math.hypot(x-avatar.position.x,z-avatar.position.z)>3.4?"Walk closer to the work area (WASD).":""}
function attempt(k,point){const pos=placementOffset(selected,k,point);if(job.sold)return;const error=check(job,selected,k)||reach(k);if(error){status(error);return}if(["frame","window","door"].includes(selected)){const p=center(k);if(Math.hypot(p.x-avatar.position.x,p.z-avatar.position.z)<.55){status("Step away from the wall before building.");return;}}if(trade.includes(selected)){openPuzzle(selected,k,pos);return}if(commit(job,selected,k,false,pos)){rebuild();updateUI();status(toolMap[selected].name+" installed.");}}
function show(content){modalOpen=true;keys.clear();preview.visible=false;previewBounds.visible=false;$("modal").innerHTML=content;$("dialog").classList.remove("hidden")}
function close(){modalOpen=false;puzzleState=null;$("dialog").classList.add("hidden");keys.clear()}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

const tradeSteps={
 outlet:["Secure the mounting box","Seat the receptacle","Fit the cover plate"],
 switch:["Secure the switch box","Seat the switch mechanism","Fit the cover plate"],
 three:["Mount both switch boxes","Seat both switch mechanisms","Fit the plates"],
 breaker:["Mount the enclosure","Seat the simulated breaker modules","Secure the cover"],
 sink:["Set the sink in position","Seat the faucet assembly","Tighten the fixture connections"],
 toilet:["Position the fixture","Seat the tank assembly","Secure the base"],
 vent:["Fit the duct boot","Seat the grille","Fasten the grille"],
 air:["Set the unit on its base","Seat the duct collars","Secure the service cover"]
};
function openPuzzle(id,k,pos){const p=puzzles[id];puzzleState={id,k,pos,stage:0,done:[],bolts:[],right:shuffle(p.pairs.map(x=>x[1])),message:"Fit the mounting hardware.",selected:-1};drawPuzzle()}
function deviceArt(id){
 if(id==="outlet")return '<rect x="280" y="72" width="140" height="240" rx="16" fill="#d5d9cd" stroke="#77877c" stroke-width="4"/><rect x="310" y="102" width="80" height="70" rx="18" fill="#f5f2dd"/><rect x="310" y="205" width="80" height="70" rx="18" fill="#f5f2dd"/>'+[130,233].map(y=>'<path d="M337 '+y+' v18 M362 '+y+' v18" stroke="#34423d" stroke-width="6" stroke-linecap="round"/><circle cx="350" cy="'+(y+27)+'" r="5" fill="#34423d"/>').join("");
 if(id==="switch"||id==="three")return (id==="three"?[280,365]:[325]).map(x=>'<rect x="'+(x-40)+'" y="85" width="80" height="215" rx="8" fill="#d0d3c9" stroke="#77877c" stroke-width="4"/><rect x="'+(x-22)+'" y="144" width="44" height="93" rx="6" fill="#f1f0dd"/><path d="M'+(x-20)+' 190 h40" stroke="#7a8277" stroke-width="3"/>').join("");
 if(id==="breaker")return '<rect x="242" y="60" width="216" height="270" rx="7" fill="#788b90" stroke="#b7c8c8" stroke-width="5"/><rect x="270" y="83" width="160" height="223" rx="3" fill="#25323b"/>'+[0,1,2,3].map(i=>'<rect x="290" y="'+(100+i*49)+'" width="120" height="37" rx="4" fill="#4d5b62"/><rect x="333" y="'+(107+i*49)+'" width="34" height="23" rx="3" fill="#20272c"/>').join("");
 if(id==="sink")return '<rect x="225" y="85" width="250" height="210" rx="42" fill="#aebec0" stroke="#e2ece6" stroke-width="5"/><rect x="249" y="112" width="202" height="155" rx="32" fill="#637e81"/><circle cx="350" cy="220" r="19" fill="#34474d" stroke="#c4d2d0" stroke-width="5"/><path d="M350 117 V75 Q350 48 375 48 Q400 48 400 78 V109" fill="none" stroke="#c6d3d2" stroke-width="16" stroke-linecap="round"/>';
 if(id==="toilet")return '<rect x="270" y="58" width="160" height="105" rx="13" fill="#dddcd0" stroke="#a7b7b1" stroke-width="4"/><ellipse cx="350" cy="234" rx="94" ry="100" fill="#efeee0" stroke="#a7b7b1" stroke-width="4"/><ellipse cx="350" cy="233" rx="65" ry="72" fill="#9ab6ba"/><ellipse cx="350" cy="240" rx="42" ry="46" fill="#6e9fa9"/>';
 if(id==="vent")return '<rect x="220" y="108" width="260" height="170" rx="8" fill="#899a9d" stroke="#ccd7d6" stroke-width="5"/>'+Array.from({length:9},(_,i)=>'<rect x="243" y="'+(128+i*15)+'" width="214" height="7" rx="2" fill="#303f43"/>').join("");
 return '<rect x="235" y="70" width="230" height="245" rx="7" fill="#aab8b7" stroke="#d9e0dd" stroke-width="4"/><circle cx="350" cy="185" r="73" fill="#52676b"/><circle cx="350" cy="185" r="58" fill="none" stroke="#899d9b" stroke-width="4"/>'+[0,90,180,270].map(a=>'<path d="M350 185 Q390 120 401 166 Q399 190 350 185" fill="#b8c5c2" transform="rotate('+a+' 350 185)"/>').join("")+'<circle cx="350" cy="185" r="13" fill="#35484c"/>';
}
function drawPuzzle(){
 const st=puzzleState,p=puzzles[st.id],steps=tradeSteps[st.id],isElec=electrical.includes(st.id),isWet=wet.includes(st.id),colors=isElec?["#d4a65e","#b9c2c5","#75bd8c","#b78ed8"]:isWet?["#e18270","#6ba8db","#b7a48a","#89bcb0"]:["#7abbd0","#b5c6d0","#d8b774","#8fbd9f"];
 const stageNames=[steps[0],"Connect the "+(isElec?"leads":isWet?"pipes":"ducts"),steps[1],steps[2],"Test the installation"];
 const n=p.pairs.length,ys=Array.from({length:n},(_,i)=>85+i*220/Math.max(1,n-1));
 const guide=p.pairs.map((pair,i)=>'<div><span style="color:'+colors[i]+'">●</span> '+pair[0]+' → '+pair[1]+'</div>').join("");
 const ports=st.stage===1?ys.map((y,i)=>'<g><path d="M48 '+y+' Q100 '+(y-16)+' 145 '+y+'" stroke="'+colors[i]+'" stroke-width="'+(isElec?7:14)+'" fill="none" stroke-linecap="round"/><circle cx="150" cy="'+y+'" r="13" fill="'+colors[i]+'" stroke="#e9e7d8" stroke-width="2" data-port="'+i+'" class="workTarget"/><text x="25" y="'+(y-18)+'" fill="#e5ece3" font-size="11">'+p.pairs[i][0]+'</text></g>').join("")+ys.map((y,i)=>'<g><rect x="514" y="'+(y-13)+'" width="26" height="26" rx="'+(isElec?5:12)+'" fill="#4f6665" stroke="#b6cbc1" stroke-width="2" data-socket="'+i+'" class="workTarget"/><text x="548" y="'+(y+4)+'" fill="#e5ece3" font-size="11">'+st.right[i]+'</text></g>').join(""):"";
 const installed=st.stage===1?st.done.map(i=>{const dest=st.right.indexOf(p.pairs[i][1]);return '<path d="M150 '+ys[i]+' C235 '+ys[i]+' 445 '+ys[dest]+' 527 '+ys[dest]+'" fill="none" stroke="'+colors[i]+'" stroke-width="'+(isElec?6:13)+'" stroke-linecap="round"/>'}).join(""):"";
 const targets=[0,2,3].includes(st.stage)?[[265,67],[435,67],[265,320],[435,320]].map(([x,y],i)=>'<g class="workTarget" data-bolt="'+i+'"><circle cx="'+x+'" cy="'+y+'" r="22" fill="'+(st.bolts.includes(i)?"#609d78":"#4a5b62")+'" stroke="'+(st.bolts.includes(i)?"#9be4a8":"#e0c775")+'" stroke-width="3"/><path d="M'+(x-8)+' '+y+' h16 M'+x+' '+(y-8)+' v16" stroke="#e9eadd" stroke-width="3" pointer-events="none"/></g>').join(""):"";
 show('<div class="tag">'+(isElec?"ELECTRICAL":isWet?"PLUMBING":"HVAC")+' / ON-SITE WORK · '+(st.stage+1)+'/5</div><h2>'+p.title+'</h2><p><b>'+stageNames[st.stage]+'</b> · '+(st.stage===1?"Drag the colored component ends into the matching ports.":st.stage===4?"Run a simulated system test.":"Hold each highlighted fastener to fit and secure the component.")+'</p><div class="guide">'+(st.stage===1?'<b>Fictional system schematic</b>'+guide:'<div>Work at the actual fixture location. Each fastener must be secured individually.</div>')+'</div><div class="workbench"><svg id="bench" viewBox="0 0 700 390" width="100%" style="display:block;touch-action:none;user-select:none"><rect width="700" height="390" rx="12" fill="#101b1d"/><path d="M0 38 H700 M0 350 H700" stroke="#293e3c"/>'+deviceArt(st.id)+installed+ports+targets+'<path id="dragWire" fill="none" stroke-width="'+(isElec?7:14)+'" stroke-linecap="round"/><text x="18" y="374" fill="#88a69d" font-size="12">ISOLATED SIMULATION · NO LIVE POWER OR PRESSURE</text></svg><div class="workProgress"><i id="workFill"></i></div></div><p id="feedback" role="status">'+st.message+'</p><div class="actions"><button id="cancel">Cancel work</button><button class="primary" id="complete" '+(st.stage===4||st.stage===1&&st.done.length===n||[0,2,3].includes(st.stage)&&st.bolts.length===4?"":"disabled")+'>'+(st.stage===4?"Run test & install · "+money(toolMap[st.id].cost):"Continue")+'</button></div><p class="muted">Game-only device models and simplified isolated circuits. Not real-world wiring, plumbing or HVAC instructions.</p>');
 const bench=$("bench");let hold=null,raf=0,dragPort=-1;
 function stop(){if(raf)cancelAnimationFrame(raf);raf=0;hold=null;const fill=$("workFill");if(fill)fill.style.width="0%"}
 function point(e){const v=bench.createSVGPoint();v.x=e.clientX;v.y=e.clientY;return v.matrixTransform(bench.getScreenCTM().inverse())}
 bench.onpointerdown=e=>{const b=e.target.closest("[data-bolt]"),a=e.target.closest("[data-port]");if(b){const i=Number(b.dataset.bolt);if(st.bolts.includes(i))return;bench.setPointerCapture(e.pointerId);hold={i,start:performance.now()};const run=t=>{if(!hold||puzzleState!==st)return;const f=Math.min(1,(t-hold.start)/680);$("workFill").style.width=f*100+"%";if(f===1){st.bolts.push(i);st.message="Fastener secured · "+st.bolts.length+"/4";stop();drawPuzzle();}else raf=requestAnimationFrame(run)};raf=requestAnimationFrame(run)}
 else if(a){const i=Number(a.dataset.port);if(st.done.includes(i))return;dragPort=i;bench.setPointerCapture(e.pointerId);$("dragWire").setAttribute("stroke",colors[i]);}};
 bench.onpointermove=e=>{if(dragPort<0)return;const v=point(e);$("dragWire").setAttribute("d","M150 "+ys[dragPort]+" C235 "+ys[dragPort]+" "+(v.x-55)+" "+v.y+" "+v.x+" "+v.y)};
 bench.onpointerup=e=>{stop();if(dragPort<0)return;const v=point(e),j=ys.findIndex(y=>Math.hypot(v.x-527,v.y-y)<30),i=dragPort;dragPort=-1;if(j>=0&&match(st.id,i,st.right[j])&&!st.done.includes(i)){st.done.push(i);st.message="Connection seated · "+st.done.length+"/"+n;}else st.message="Connection did not fit. Check the schematic and try again.";drawPuzzle()};
 bench.onpointercancel=()=>{stop();dragPort=-1;$("dragWire").removeAttribute("d")};
 $("cancel").onclick=()=>{stop();close()};$("complete").onclick=()=>{if(st.stage===4){if(commit(job,st.id,st.k,true,st.pos)){rebuild();updateUI();status(p.title+" installed and tested.");}close();return;}if(st.stage===1?st.done.length!==n:st.bolts.length!==4)return;st.stage++;st.bolts=[];st.message=st.stage===1?"Connect the physical leads or fittings.":st.stage===4?"All components are fitted. Ready to test.":"Secure each highlighted point.";drawPuzzle()};
}
function openInspection(){const items=inspection(job),ok=items.every(x=>x.ok);show('<div class="tag">PROPERTY / INSPECTION</div><h2>Ready for sale?</h2><p>Estimated sale price '+money(price(job))+' · construction cost '+money(job.spent)+'</p><div class="inspection">'+items.map(i=>'<div class="'+(i.ok?"pass":"fail")+'">'+(i.ok?"✓ ":"○ ")+i.name+'</div>').join("")+'</div><div class="actions"><button id="cancel">Back to work</button><button class="primary" id="sell" '+(ok?"":"disabled")+'>Sell property</button></div>');$("cancel").onclick=close;$("sell").onclick=()=>{if(sell(job)){updateUI();show('<div class="tag">PROPERTY SOLD</div><h2>Sale completed</h2><p>Cash: '+money(job.cash)+' · '+job.homes+' homes sold.</p><button id="new" class="primary">Start a new custom home</button>');$("new").onclick=()=>{next(job);avatar.position.set(0,0,9.2);rebuild();updateUI();close();status("New lot ready.")}}}}
function toggleSnap(){snap=!snap;siteGrid.visible=snap;$("snap").textContent="Snap: "+(snap?"ON":"OFF");$("snap").setAttribute("aria-pressed",String(snap));previewSignature="";status(snap?"Grid snap enabled.":"Free fixture positioning enabled. Structural modules attach to their foundation; the first tile sets the layout origin.");if(hoverKey)refreshPreview(hoverKey,hoverPos)}
$("snap").onclick=toggleSnap;
$("undo").onclick=()=>{if(!modalOpen&&undo(job)){rebuild();updateUI();status("Last change undone.")}};$("roofView").onclick=()=>{roofVisible=!roofVisible;$("roofView").textContent="Roof: "+(roofVisible?"visible":"hidden");rebuild()};$("inspect").onclick=openInspection;$("reset").onclick=()=>{yaw=0;zoom=7;pitch=.83};
window.addEventListener("keydown",e=>{if(modalOpen){if(e.key==="Escape"&&!job.sold)close();return}const k=e.key.toLowerCase();if(k==="g"&&!e.repeat){e.preventDefault();toggleSnap();return}if(["w","a","s","d","q","e","shift"].includes(k)){e.preventDefault();keys.add(k)}});window.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));window.addEventListener("blur",()=>keys.clear());for(const b of document.querySelectorAll("[data-move]")){b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.move)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.move)}
try{boot()}catch(e){console.error(e);show('<h2>Unable to start the 3D site</h2><p>WebGL initialization failed. Check browser graphics acceleration.</p><a href="/">Return to GAMESHUB</a>');}
