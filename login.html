<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GAMESHUB Access</title>

  <link
    rel="icon"
    type="image/png"
    href="/logo.png"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 10%,
          #202938,
          #0b0e13 55%
        );

      color: white;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .login {
      width: min(100%, 410px);
      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;

      margin: 0 auto 18px;

      display: grid;
      place-items: center;

      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }

    h1 {
      font-size: 28px;

      letter-spacing: 4px;
    }

    .subtitle {
      margin-top: 8px;

      color: #7f8999;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 2px;
    }

    .panel {
      margin-top: 34px;

      padding: 28px;

      border:
        1px solid #272e3a;

      border-radius: 18px;

      background: #12161e;
    }

    label {
      display: block;

      margin-bottom: 12px;

      color: #a0a9b6;

      text-align: left;

      font-size: 13px;
    }

    input {
      width: 100%;

      padding: 15px;

      border:
        1px solid #303846;

      border-radius: 11px;

      outline: none;

      background: #0c0f15;

      color: white;

      text-align: center;

      font-size: 24px;

      letter-spacing: 9px;
    }

    input:focus {
      border-color: #707b8c;
    }

    button {
      width: 100%;

      margin-top: 13px;

      padding: 14px;

      border: none;

      border-radius: 11px;

      background: white;

      color: #090b0f;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform .12s,
        background .12s;
    }

    button:hover {
      background: #e8eaee;
    }

    button:active {
      transform: scale(.985);
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #message {
      min-height: 20px;

      margin-top: 13px;

      color: #f27474;

      font-size: 13px;
    }

    .note {
      margin-top: 18px;

      color: #616b7a;

      font-size: 11px;
    }

    .shake {
      animation:
        shake .28s linear;
    }

    @keyframes shake {
      0% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-7px);
      }

      50% {
        transform: translateX(7px);
      }

      75% {
        transform: translateX(-5px);
      }

      100% {
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>

  <main class="login">

    <div class="logo">
      <img
        src="/logo.png"
        alt="GAMESHUB logo"
      >
    </div>

    <h1>
      GAMESHUB
    </h1>

    <div class="subtitle">
      PRIVATE GAME NETWORK
    </div>

    <form
      class="panel"
      id="loginForm"
    >

      <label for="code">
        Enter access code
      </label>

      <input
        id="code"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        maxlength="20"
        required
      >

      <button
        id="submitButton"
        type="submit"
      >
        UNLOCK
      </button>

      <div
        id="message"
        aria-live="polite"
      ></div>

    </form>

    <div class="note">
      Access is invite-only.
    </div>

  </main>


  <script>
    const form =
      document.getElementById(
        "loginForm"
      );

    const code =
      document.getElementById(
        "code"
      );

    const message =
      document.getElementById(
        "message"
      );

    const submitButton =
      document.getElementById(
        "submitButton"
      );


    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        message.textContent = "";

        submitButton.disabled = true;

        submitButton.textContent =
          "CHECKING...";

        try {

          const response =
            await fetch(
              "/api/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    code: code.value
                  })
              }
            );


          if (response.ok) {

            location.replace("/");

            return;
          }


          message.textContent =
            "Incorrect access code.";

          form.classList.remove(
            "shake"
          );

          void form.offsetWidth;

          form.classList.add(
            "shake"
          );

          code.select();

        }
        catch {

          message.textContent =
            "Unable to contact the server.";

        }


        submitButton.disabled = false;

        submitButton.textContent =
          "UNLOCK";
      }
    );


    code.focus();
  </script>

</body>
</html>
