<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GAMESHUB Access</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 25px;

      background:
        radial-gradient(
          circle at 50% 10%,
          #202938,
          #0b0e13 55%
        );

      color: #f3f5f8;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .login {
      width: min(
        100%,
        410px
      );

      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;

      display: grid;
      place-items: center;

      margin:
        0 auto
        19px;

      border-radius: 17px;

      background: #171c25;

      border:
        1px solid #29313e;

      font-size: 18px;
      font-weight: 900;
    }

    h1 {
      font-size: 27px;

      letter-spacing: 4px;
    }

    .private {
      margin-top: 8px;

      color: #7f8999;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 2px;
    }

    .panel {
      margin-top: 34px;

      padding: 27px;

      border:
        1px solid #272e3a;

      border-radius: 17px;

      background: #12161e;
    }

    label {
      display: block;

      margin-bottom: 12px;

      color: #a0a9b6;

      text-align: left;

      font-size: 13px;
    }

    input {
      width: 100%;

      padding: 15px;

      outline: none;

      border:
        1px solid #303846;

      border-radius: 11px;

      background: #0c0f15;

      color: white;

      text-align: center;

      font-size: 24px;

      letter-spacing: 9px;
    }

    input:focus {
      border-color: #707b8c;
    }

    button {
      width: 100%;

      margin-top: 13px;

      padding: 14px;

      border: none;
      border-radius: 11px;

      background: white;
      color: #090b0f;

      font-weight: 800;

      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #error {
      min-height: 20px;

      margin-top: 13px;

      color: #f27474;

      font-size: 13px;
    }

    .note {
      margin-top: 18px;

      color: #616b7a;

      font-size: 11px;
    }

    .shake {
      animation:
        shake .28s linear;
    }

    @keyframes shake {

      0% {
        transform:
          translateX(0);
      }

      25% {
        transform:
          translateX(-7px);
      }

      50% {
        transform:
          translateX(7px);
      }

      75% {
        transform:
          translateX(-5px);
      }

      100% {
        transform:
          translateX(0);
      }

    }

  </style>
</head>

<body>

  <main class="login">

    <div class="logo">
      GH
    </div>

    <h1>
      GAMESHUB
    </h1>

    <div class="private">
      PRIVATE GAME NETWORK
    </div>


    <form
      id="login-form"
      class="panel"
    >

      <label for="code">
        Enter access code
      </label>

      <input
        id="code"
        name="code"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        maxlength="20"
        required
      >

      <button
        id="submit"
        type="submit"
      >
        UNLOCK
      </button>

      <div
        id="error"
        aria-live="polite"
      ></div>

    </form>


    <div class="note">
      Access is invite-only.
    </div>

  </main>


<script>

const form =
  document.getElementById(
    "login-form"
  );


const input =
  document.getElementById(
    "code"
  );


const button =
  document.getElementById(
    "submit"
  );


const error =
  document.getElementById(
    "error"
  );


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    error.textContent =
      "";


    button.disabled =
      true;


    button.textContent =
      "CHECKING...";


    try {

      const response =
        await fetch(
          "/api/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                code:
                  input.value
              })
          }
        );


      if (
        response.ok
      ) {

        location.replace(
          "/"
        );

        return;

      }


      error.textContent =
        "Incorrect access code.";


      form.classList.remove(
        "shake"
      );


      void form.offsetWidth;


      form.classList.add(
        "shake"
      );


      input.select();

    }
    catch {

      error.textContent =
        "Unable to contact the server.";

    }


    button.disabled =
      false;


    button.textContent =
      "UNLOCK";

  }
);


input.focus();

</script>

</body>
</html>
