<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">
  <title>GAMESHUB — Under Maintenance</title>
  <link rel="icon" href="/logo.png">
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow-x: hidden; color: #f6f7fb; background: #0b0e13; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at 50% 26%, rgba(241,190,45,.12), transparent 43%),
                  linear-gradient(130deg, rgba(255,255,255,.025), transparent 58%); }
    .caution { position: fixed; left: 0; right: 0; height: 20px; z-index: 3; overflow: hidden;
      background: repeating-linear-gradient(110deg, #facc30 0px, #facc30 22px, #141414 22px, #141414 44px);
      background-size: 210px 100%; animation: sweep 3s linear infinite;
      box-shadow: 0 0 28px rgba(245,189,33,.17); }
    .caution.top { top: 0; } .caution.bottom { bottom: 0; animation-direction: reverse; }
    @keyframes sweep { to { background-position: 210px 0; } }
    main { min-height: 100vh; display: flex; justify-content: center; align-items: center;
      text-align: center; padding: 90px 24px; }
    .content { max-width: 750px; width: 100%; }
    .brand { display: flex; justify-content: center; align-items: center; gap: 13px; margin-bottom: 48px; }
    .brand img { width: 50px; height: 50px; object-fit: contain; }
    .brand span { font-size: 23px; font-weight: 900; letter-spacing: .22em; }
    .icon { width: 112px; height: 112px; display: grid; place-items: center; margin: 0 auto 27px;
      background: rgba(248,197,48,.08); border: 1px solid rgba(248,197,48,.36);
      border-radius: 25px; box-shadow: 0 0 65px rgba(244,194,43,.08); }
    .icon svg { width: 66px; height: 66px; stroke: #f8c62b; }
    .eyebrow { font-weight: 800; letter-spacing: .29em; color: #f5c72f; font-size: 12px; text-transform: uppercase; }
    h1 { font-size: clamp(37px, 7vw, 76px); letter-spacing: -.065em; line-height: 1.04;
      margin: 18px 0 21px; text-transform: uppercase; font-weight: 900; }
    p { margin: 0 auto; max-width: 540px; color: #adb5c3; font-size: clamp(16px, 2.4vw, 19px); line-height: 1.7; }
    .notice { margin: 36px auto 0; display: inline-flex; gap: 12px; align-items: center;
      border: 1px solid #353338; background: #15171d; padding: 13px 20px;
      border-radius: 100px; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #d0d5df; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f3c52d; box-shadow: 0 0 12px #f3c52d; }
    .developer-entry { margin-top: 60px; }
    button { cursor: pointer; border: 0; background: transparent; color: #858f9f; text-decoration: underline;
      text-underline-offset: 4px; font-size: 13px; padding: 12px; }
    button:hover, button:focus-visible { color: #fff; }
    .signin { margin: 18px auto 0; max-width: 370px; border: 1px solid #30343c; background: #11151b;
      border-radius: 16px; padding: 22px; }
    .signin strong { display: block; margin-bottom: 14px; font-size: 14px; }
    #googleButton { display: flex; justify-content: center; min-height: 40px; }
    #signInMessage { font-size: 13px; line-height: 1.5; margin-top: 12px; color: #ffcf61; }
    .preview { display: none; position: fixed; z-index: 5; top: 30px; left: 50%; transform: translateX(-50%);
      background: #f4cc35; color: #111; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 800; }
    .preview a { color: #111; margin-left: 14px; }
    @media (prefers-reduced-motion: reduce) { .caution { animation: none; } }
  </style>
</head>
<body>
  <div class="caution top" aria-hidden="true"></div>
  <div class="caution bottom" aria-hidden="true"></div>
  <div class="preview" id="preview">DEVELOPER PREVIEW <a href="/developer.html">Back to panel</a></div>
  <main>
    <div class="content">
      <div class="brand"><img src="/logo.png" alt=""><span>GAMESHUB</span></div>
      <div class="icon" aria-hidden="true">
        <svg fill="none" viewBox="0 0 64 64" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M27.8 10.5a5 5 0 0 1 8.4 0l24 39A5 5 0 0 1 56 57H8a5 5 0 0 1-4.2-7.5z"/>
          <path d="M32 24v16M32 48h.01"/>
        </svg>
      </div>
      <div class="eyebrow">Attention players</div>
      <h1>Under<br>Maintenance</h1>
      <p>GAMESHUB is temporarily closed while our development team works on improvements behind the scenes. Thanks for your patience — we'll be back when the work is done.</p>
      <div class="notice"><span class="dot" aria-hidden="true"></span> DEVELOPMENT IN PROGRESS</div>
      <div class="developer-entry">
        <button type="button" id="showDeveloperSignIn" aria-expanded="false">Developer access</button>
        <div class="signin" id="signInPanel" hidden>
          <strong>Authorized developers only</strong>
          <div id="googleButton"></div>
          <div id="signInMessage" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </main>
  <script>
    'use strict';
    const CLIENT_ID = '683249112077-m8qs13n230mmp6qpk71ok5mbmi1s10v0.apps.googleusercontent.com';
    const panel = document.getElementById('signInPanel');
    const message = document.getElementById('signInMessage');
    const button = document.getElementById('showDeveloperSignIn');
    const preview = new URLSearchParams(location.search).get('preview') === '1';
    if (preview) document.getElementById('preview').style.display = 'block';
    let googleStarted = false;
    button.addEventListener('click', () => {
      panel.hidden = !panel.hidden;
      button.setAttribute('aria-expanded', String(!panel.hidden));
      if (panel.hidden || googleStarted) return;
      googleStarted = true;
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.async = true;
      script.onload = () => {
        google.accounts.id.initialize({client_id: CLIENT_ID, callback: googleCredential, auto_select: false});
        google.accounts.id.renderButton(document.getElementById('googleButton'),
          {type: 'standard', theme: 'filled_black', size: 'large', text: 'signin_with', width: 250});
      };
      script.onerror = () => { message.textContent = 'Google sign-in could not load. Please try again later.'; };
      document.head.appendChild(script);
    });
    async function googleCredential(result) {
      message.textContent = 'Checking developer access…';
      try {
        const login = await fetch('/api/account/google', {method: 'POST', credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'}, body: JSON.stringify({credential: result.credential})});
        if (!login.ok) throw new Error('Google sign-in failed.');
        const check = await fetch('/api/dev/maintenance', {credentials: 'same-origin', cache: 'no-store'});
        if (check.status === 403) { message.textContent = 'This account does not have developer access.'; return; }
        if (!check.ok) throw new Error('Developer verification is temporarily unavailable.');
        window.location.replace('/developer.html');
      } catch (error) { message.textContent = error.message || 'Developer sign-in failed.'; }
    }
  </script>
</body>
</html>
